name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - name: Install Qt 6 rendering test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qttest
      - name: Test inspector rendering and interaction
        env:
          QT_QUICK_BACKEND: software
        run: /usr/lib/qt6/bin/qmltestrunner -platform offscreen -input tests/qml
      - name: Test the bar widget against shell stubs
        env:
          QT_QUICK_BACKEND: software
        run: /usr/lib/qt6/bin/qmltestrunner -platform offscreen -import tests/qml-bar/stubs -input tests/qml-bar
