name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          version="$(node -p 'require("./manifest.json").version')"
          title="$(node -p 'require("./manifest.json").name') $version"

          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $version"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, leaving it untouched"
            exit 0
          fi

          notes="design/releases/$version.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Commit the release notes at $notes before tagging"
            exit 1
          fi

          release_args=()
          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" --title "$title" --notes-file "$notes" "${release_args[@]}"
